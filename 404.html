<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Saurav Chaudhary</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#076f51">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 32px 0; position: relative; }
    .nf::before {
      content: ""; position: absolute; z-index: -1; width: 460px; height: 460px; max-width: 90vw; border-radius: 50%; filter: blur(40px);
      background: radial-gradient(circle, color-mix(in srgb, var(--accent) 26%, transparent), transparent 68%);
      animation: drift 14s ease-in-out infinite alternate;
    }
    .nf .nf-code {
      font: 700 clamp(6rem, 22vw, 11rem)/1 var(--font-head); letter-spacing: -.06em; margin: 0;
      background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: rise .7s cubic-bezier(.2,.7,.2,1) both;
    }
    .nf h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: .5rem 0 .75rem; animation: rise .7s cubic-bezier(.2,.7,.2,1) .1s both; }
    .nf p { color: var(--muted); max-width: 30em; margin: 0 auto; animation: rise .7s cubic-bezier(.2,.7,.2,1) .2s both; }
    .nf .cta { justify-content: center; animation: rise .7s cubic-bezier(.2,.7,.2,1) .3s both; }
    .nf .path { font: 400 .85rem var(--font-mono); margin-top: 1.5rem; color: var(--muted); word-break: break-all; animation: rise .7s ease .4s both; }
    @media (prefers-reduced-motion: reduce) { .nf::before, .nf-code, .nf h1, .nf p, .nf .cta, .nf .path { animation: none; } }
  </style>
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
</head>
<body>
  <main class="wrap nf" id="main">
    <div>
      <p class="nf-code" aria-hidden="true">404</p>
      <h1>This page wandered off.</h1>
      <p>The link may be broken or the page may have moved. Head back to the portfolio, or say hello and I'll point you in the right direction.</p>
      <div class="cta">
        <a class="btn primary" href="/">Back to home</a>
        <a class="btn" href="mailto:saurav.ch.sde@gmail.com">Email me</a>
      </div>
      <p class="path" id="path"></p>
    </div>
  </main>
  <script>
    document.getElementById("path").textContent = location.pathname;
  </script>
</body>
</html>
